<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="left">
        <p> © 2024 Central Perk Cafe. All rights reserved.</p>
    </div>
    <div class="right">
        <h3>Central Perk Cafe</h3>
        <h1>Welcome Back!</h1>
        <p>We've missed you. Log in to your account to continue your coffee journey.</p>
        <form>
            <label for="email">Email Address</label><br>
            <input type="email" id="email" name="email" placeholder="name@example.com"><br>

            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="••••••••"><br>

            <input type="checkbox" id="terms" name="terms">
            <label for="terms">Remember me for 30 days</label><br>

            <button class="login">LOGIN</button>
            <p class="divider">-------- OR --------</p>
            <button class="google">Continue with Google</button>

            <p>Don't have an account?<a href="signup.html"> Sign up.</a></p>


        </form>
    </div>
    </body>
</html>
