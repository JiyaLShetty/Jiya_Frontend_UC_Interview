<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signupstyles.css">
    <title>Document</title>
</head>
<body>
    <div class="left">
    </div>

    <div class="right">
        <h2>Central Perk Cafe</h2>
        <h1>Create your account</h1>
        <p class="subtitle">Join our digital living room for the finest brews and cozy moments.</p>
        <form>
            <div>
                <label for="fullname">Full name</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Phoebe Buffay"><br>
            </div>
            <div>
                <label for="email">Email Address</label><br>
                <input type="email" id="email" name="email" placeholder="smellycat@centralperk.com"><br>
            </div>
            <div class="pass">
                <div>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" placeholder="••••••••"><br>
                </div>
                <div>
                    <label for="cpassword">Confirm Password</label><br>
                    <input type="password" id="cpassword" name="cpassword" placeholder="••••••••"><br>
                </div>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the Terms of Service</label>
            </div>
        </form>

        <div id="signup">
            <button type="submit">Sign up</button>
        </div>
        <div class="signup-statement">
            <p>Already have an account?<b><a href="login.html"> Login</a></b></p>
        </div>
        <hr>
         <div class="footer-links">
            <a>Privacy Policy</a>
            <a>Terms of Service</a>
            <a>Accessibility</a>
        </div>
    </div>
</body>
</html>
